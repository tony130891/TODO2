<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="content">
    <div class="sidebar">
      <ul class="schedule">
        <li class="Today">Today</li>
        <li class="Upcoming">Upcoming</li>
        <li class="Anytime">Anytime</li>
        <li class="Someday">Someday</li>
        <li class="Logbook">Logbook</li>
      </ul>
      <ul class="category">
      </ul>
    </div>

    <dialog id="todoDialog">
      <div class="dialogContent">
        <form method="dialog" id="todoForm">
          <button id="close-dialog">Close</button>
          <div class="form-group">
            <label for="title">Title</label>
            <input autofocus type="text" id="input-title" name="title">
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="input-description" name="description">
          </div>
          <div class="form-group">
            <label for="duedate">Select date:</label>
            <input type="date" id="input-duedate" name="duedate">
          </div>
          <div class="form-group">
            <label for="priorityhigh">High</label>
            <input type="radio" id="priorityhigh" name="priority" value="high">
            <label for="prioritymedium">Medium</label>
            <input type="radio" id="prioritymedium" name="priority" value="medium">
            <label for="prioritylow">Low</label>
            <input type="radio" id="prioritylow" name="priority" value="low">
          </div>
          <button id="submit-task">Add task</button>
        </form>
      </div>
    </dialog>

    <div class="main"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
