<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adding webpack</title>
</head>
<body>
  <div class="content">
     <div class="title"></div>

     <div class="main"></div>

     <div class="sidebar">
      <ul class="schedule">
        <button class="addTask">Add Task</button>
        <button class="home">Home</button>
        <button class="today">Today</button>
        <button class="tomorrow">Tomorrow</button>
        <button class="soon">Soon</button>
        <button class="done">Done</button>
      </ul>
      <ul class="category">
        <button>Coding</button>
        <button>Exercising</button>
        <button>Cooking</button>
      </ul>
    </div>

    <dialog id="todoDialog">
      <div class="dialogContent">
      <form method="dialog" id="todoForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input autofocus type="text" id="input-title" name="title">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="input-description" name="description">
        </div>
        <div class="form-group">
          <label for="duedate">Select date:</label>
          <input type="date" id="input-duedate" name="duedate">
        </div>
        <div class="form-group">
          <label for="priorityhigh">High</label>
            <input type="radio" id="priorityhigh" name="priority" value="high" checked>
          <label for="prioritymedium">Medium</label>
          <input type="radio" id="prioritymedium" name="priority" value="medium">
          <label for="prioritylow">Low</label>
          <input type="radio" id="prioritylow" name="priority" value="low">
        </div>
        <button id="submit-task">Submit</button>
        <button id="close-dialog">Close</button>
      </form>
      </div>
    </dialog>

  </div>
    
</body>
</html>
